<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granted - Grant Assistant</title>
    <style>
        /* Global Styles */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Header & Config */
        .header {
            margin-top: 20px;
            text-align: center;
        }
        .header h1 {
            color: #ff9800; /* Orange accent */
            margin: 10px 0;
        }
        .header p {
            color: #aaaaaa;
            margin-top: 0;
            font-size: 0.9em;
        }
        
        .config-container {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .config-container label {
            font-size: 0.9em;
            color: #ff9800;
        }
        .config-container input {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ff9800;
            background-color: #222;
            color: #fff;
            width: 250px;
        }

        /* Chat Layout */
        .chat-box {
            flex-grow: 1;
            width: 90%;
            max-width: 800px;
            background-color: #121212;
            border: 1px solid #ff9800;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Message Bubbles */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .user-message {
            align-self: flex-end;
            background-color: #ff9800; /* Orange accent */
            color: #000000;
            border-bottom-right-radius: 0;
            font-weight: 500;
        }

        .agent-message {
            align-self: flex-start;
            background-color: #2a2a2a;
            color: #ffffff;
            border-bottom-left-radius: 0;
            white-space: pre-wrap; /* Preserves formatting and line breaks */
        }

        .loading-text {
            color: #ff9800;
            font-style: italic;
            align-self: flex-start;
            font-size: 0.9em;
            display: none;
        }

        /* Input Area */
        .input-area {
            width: 90%;
            max-width: 800px;
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .input-area input {
            flex-grow: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background-color: #ffffff; /* White search bar */
            color: #000000;
            font-size: 16px;
            outline: none;
        }
        
        .input-area input::placeholder {
            color: #666666;
        }
        
        .input-area button {
            padding: 0 25px;
            border: none;
            border-radius: 8px;
            background-color: #ff9800; /* Orange accent */
            color: #000000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .input-area button:hover {
            background-color: #e68a00;
        }
        
        .input-area button:disabled {
            background-color: #663d00;
            color: #999;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Granted</h1>
        <p>End-to-End Grant Discovery & Proposal Assistant</p>
    </div>

    <div class="config-container">
        <label for="api-url">API URL (Optional):</label>
        <input type="text" id="api-url" placeholder="Leave blank for relative /chat">
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message agent-message">Hello! I am Granted, your nonprofit funding assistant. How can I help you discover grants or draft proposals today?</div>
        <div class="loading-text" id="loading-indicator">Granted is thinking...</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask about a grant, request a proposal, or draft an email..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiUrlInput = document.getElementById('api-url');
        const loadingIndicator = document.getElementById('loading-indicator');

        // Send message on Enter key press
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // 1. Add user message to UI
            appendMessage(message, 'user-message');
            
            // Clear input and disable UI while loading
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            // Show loading indicator and scroll to it
            chatBox.appendChild(loadingIndicator);
            loadingIndicator.style.display = 'block';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Determine URL (Fallback to '/chat')
            const apiUrl = apiUrlInput.value.trim() || '/chat';

            // 3. Send POST request
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }

                const data = await response.json();
                
                // Hide loading and append Agent response
                loadingIndicator.style.display = 'none';
                appendMessage(data.response, 'agent-message');

            } catch (error) {
                loadingIndicator.style.display = 'none';
                appendMessage("Sorry, there was an error communicating with the server: " + error.message, 'agent-message');
            } finally {
                // Re-enable UI
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            
            // Insert before the loading indicator so loading always stays at bottom
            chatBox.insertBefore(messageDiv, loadingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
